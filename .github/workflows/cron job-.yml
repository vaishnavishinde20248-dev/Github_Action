name: Daily Cron Job - 8 AM

on:
  schedule:
    - cron: "0 8 * * *"

jobs:
  daily-job:
    runs-on: ubuntu-latest

    steps:
      - name: Job Started
        run: echo "Daily job started successfully!"

      - name: Display Date and Time
        run: date

      - name: Completion Message
        run: echo "Daily job completed successfully!"
